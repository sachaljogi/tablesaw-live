name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build (Java 17, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test with Maven
        run: mvn -B clean verify
